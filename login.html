<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FashionAI | Login</title>


<!-- Google Font -->

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">


<!-- Font Awesome -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<!-- Login CSS -->

<link rel="stylesheet" href="css/login.css">


</head>


<body>



<div class="login-page">



    <!-- Left AI Image Section -->

    <div class="login-left">


        <div class="ai-logo">

            <i class="fa-solid fa-shirt"></i>

            <h1>FashionAI</h1>

        </div>


        <h2>

            Welcome Back To Your AI Fashion Assistant

        </h2>


        <p>

            Login to explore personalized outfits,
            virtual try-on and smart fashion recommendations.

        </p>



        <div class="login-icons">


            <div>

                <i class="fa-solid fa-wand-magic-sparkles"></i>

                <span>AI Styling</span>

            </div>


            <div>

                <i class="fa-solid fa-camera"></i>

                <span>Virtual Try-On</span>

            </div>


            <div>

                <i class="fa-solid fa-brain"></i>

                <span>Smart AI</span>

            </div>


        </div>


    </div>





    <!-- Login Form -->

    <div class="login-right">


        <div class="login-box">


            <h2>

                Login

            </h2>


            <p>

                Enter your details to continue

            </p>




            <form id="loginForm">



                <div class="input-box">


                    <i class="fa-solid fa-envelope"></i>


                    <input 
                    type="email"
                    placeholder="Email Address"
                    required>


                </div>





                <div class="input-box">


                    <i class="fa-solid fa-lock"></i>


                    <input 
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>


                </div>




                <div class="remember">


                    <label>


                    <input type="checkbox" id="remember">

                    Remember me


                    </label>



                    <a href="#" id="forgotPassword">

                    Forgot Password?

                    </a>


                </div>





                <button class="login-submit">

                    Login

                </button>





                <div class="or">

                    OR

                </div>





                <button class="google-btn" type="button" id="googleLogin">


                    <i class="fa-brands fa-google"></i>

                    Continue With Google


                </button>





                <p class="signup-text">


                    Don't have an account?


                    <a href="register.html">

                    Create Account

                    </a>


                </p>



            </form>



        </div>


    </div>



</div>






<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>

</html>
